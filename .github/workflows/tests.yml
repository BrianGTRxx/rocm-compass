name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege: this job only checks out code and runs tests, it never
# needs to write anything. The repo's own default is already read-only, but
# stating it here means that stays true regardless of what the repo-wide
# default gets changed to later.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: pytest -v
