name: Ingest environment reports

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  # Serializes runs for the SAME issue instead of letting them race. Needed
  # for real: `gh issue create --label report` fires both an `opened` and a
  # `labeled` event for one issue, starting two runs seconds apart. Without
  # this they raced to `git push` -- one won, the other failed outright.
  # cancel-in-progress stays false so the second run still executes (and,
  # combined with the live re-check below, cleanly no-ops) instead of being
  # killed mid-way.
  group: ingest-report-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this issue was already ingested
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Re-fetches live state instead of trusting github.event.issue.labels,
            // which is a snapshot from whenever THIS run's triggering event fired --
            // stale by the time a queued, concurrency-serialized run actually starts.
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const labels = issue.data.labels.map((l) => l.name);
            core.setOutput("already_ingested", labels.includes("ingested"));

      - if: steps.check.outputs.already_ingested != 'true'
        uses: actions/checkout@v7

      - if: steps.check.outputs.already_ingested != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - if: steps.check.outputs.already_ingested != 'true'
        run: pip install -e .

      - name: Parse and append the report
        id: ingest
        if: steps.check.outputs.already_ingested != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          RESULT=$(printf '%s' "$ISSUE_BODY" | python scripts/ingest_report_issue.py)
          STATUS=$?
          set -e
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "ok=$([ $STATUS -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit the new report
        if: steps.check.outputs.already_ingested != 'true' && steps.ingest.outputs.ok == 'true'
        run: |
          git config user.name "rocm-compass-bot"
          git config user.email "actions@github.com"
          git add compass/community_reports.jsonl
          git diff --cached --quiet || git commit -m "Ingest report from issue #${{ github.event.issue.number }} [skip ci]"
          git push

      - name: Comment and close on success
        if: steps.check.outputs.already_ingested != 'true' && steps.ingest.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          # RESULT ultimately contains attacker-controllable content (the
          # submitted package_name/gpu_arch/etc, see scripts/ingest_report_issue.py).
          # Passing it as an env var -- read below via process.env, never
          # substituted into the script text -- avoids the classic
          # "${{ }} inside a github-script template literal" injection: a
          # crafted package_name containing a backtick/${...} sequence could
          # otherwise break out of the JS string and run arbitrary code with
          # this job's contents:write/issues:write permissions.
          RESULT: ${{ steps.ingest.outputs.result }}
        with:
          script: |
            const result = process.env.RESULT.replace(/^OK: /, '');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Ingested: ${result}\n\nThanks -- this is now part of the community compatibility matrix.`,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["ingested"],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment on rejection
        if: steps.check.outputs.already_ingested != 'true' && steps.ingest.outputs.ok == 'false'
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.ingest.outputs.result }}
        with:
          script: |
            const result = process.env.RESULT.replace(/^REJECTED: /, '');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Could not ingest this report: ${result}\n\nEdit the issue with a valid \`\`\`json block and it'll be retried automatically.`,
            });
