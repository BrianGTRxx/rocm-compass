[project]
name = "rocm-compass"
version = "0.1.0"
description = "Environment diagnostics, compatibility resolver, and a live-tracked map of the Python AI ecosystem on ROCm."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
rocm-doctor = "doctor.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doctor", "compass", "shared"]
